name: トレカバンク買取ウォッチ メール

# store.torecabank.com/kaitori_list を取得してメールする個人用cron。取得は公開HTML(埋め込みJSON)のみ＝ブラウザ/APIキー不要。
# 送信は【毎日12:00 JST・フルリスト＋前日比】(ユーザー指示2026-07-11。旧2モード制は廃止):
#   残り点数下限は買取額で段階(50万↑=20点/10万↑=30点/未満=50点)・BOX除外のリストを毎日送信。各行に前日比(いくらプラスか)＝値上がり→値下がり→変動なし順。
# 信頼性: Vercel Cron(12:00 JST・vercel.json→/api/cron/torecabank)を主系統に、このGitHub Actions(12:05/13:00 JST)を予備に二重化。KV「本日送信済み」ガードで二重送信防止(1日1通)。
# 手動(workflow_dispatch / トリガーpush)は FORCE_SEND=1 でガード無視して必ず送る。失敗時は末尾ステップが警告メール。
on:
  schedule:
    # 毎日12:00 JST(ユーザー指示2026-07-11)。JST=UTC+9 → 12:00 JST=03:00 UTC。曜日判定はスクリプト側(JST)。
    - cron: '5 3 * * *'    # 毎日 約12:05 JST（GitHub予備）
    - cron: '0 4 * * *'    # 毎日 約13:00 JST（GitHub予備の予備）。主系統は Vercel Cron(12:00)。
  workflow_dispatch:
  push:
    paths:
      - 'scripts/.torecabank-trigger'

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Send torecabank kaitori mail
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: chikara0323@gmail.com
          MAIL_BCC: m08h22@icloud.com   # 追加宛先（Bcc＝お互い非表示）。複数はカンマ区切り
          MIN_REMAINING: '50'   # 残り点数下限の基本値=買取10万円未満に適用（10万↑=30点/50万↑=20点はスクリプト内固定）
          MAX_PRICE: '0'   # 0=買取額の上限なし（ユーザー指示2026-07-09で5万上限を解除）
          EXCLUDE_BOX: '1'   # 未開封BOXを除外（BOX以外のみ・ユーザー指示）。BOXも含めるなら '0'
          # 価格の前日比/前週比＋「本日送信済み」ガードのため、既存KVを使用（書き込みは1日数回・軽量）。
          KV_REST_API_URL:   ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          # schedule(自動)はガード有効＝1日1通。手動(dispatch/push)は必ず送る。
          FORCE_SEND: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: node scripts/torecabankKaitoriMail.mjs
      # どのステップが失敗しても（サイト構造変更・取得失敗・送信失敗など）警告メールを出す＝無通知の欠配を防ぐ。
      - name: 失敗通知
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"from":"トレカバンク買取ウォッチ <noreply@yushutsu-fukugyo.com>","to":"chikara0323@gmail.com","subject":"⚠️ トレカバンク買取メールが失敗しました","html":"<p>本日のトレカバンク買取ウォッチが失敗しました（サイトのHTML構造変更・取得エラー・送信エラーなどの可能性）。<br>GitHub Actions のログを確認してください。</p>"}' \
            || echo "alert mail failed"
