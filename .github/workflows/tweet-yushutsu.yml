name: 輸出ラボ 自動投稿

on:
  # 投稿のスケジューリングは外部cronから workflow_dispatch でトリガーする運用のため、
  # GitHub Actions の schedule は使わない（schedule を残すと外部cronと二重投稿になり
  # X APIのURL投稿課金 $0.20/件 が倍になるため、意図的に設定しない）。
  # ピーク時間帯への集中投稿の制御は外部cron側で行う。
  workflow_dispatch:

jobs:
  tweet:
    # ⏸ 2026-06-26 停止（ユーザー指示「Xの自動投稿を止めていい」）。cron-job.orgが叩いてもジョブskip＝投稿されない。
    #    再開はこの if 行を削除するだけ。
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install tweepy anthropic requests pytz

      - name: Tweet
        env:
          TWITTER_API_KEY:             ${{ secrets.YUSHUTSU_TWITTER_API_KEY }}
          TWITTER_API_SECRET:          ${{ secrets.YUSHUTSU_TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:        ${{ secrets.YUSHUTSU_TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.YUSHUTSU_TWITTER_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          KV_REST_API_URL:             ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN:           ${{ secrets.KV_REST_API_TOKEN }}
          RESEND_API_KEY:              ${{ secrets.RESEND_API_KEY }}
        run: python scripts/sns_bot/tweet_auto.py

      - name: エラー通知メール
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.resend.com
          server_port: 465
          secure: true
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: "❌ 輸出ラボBot エラー発生"
          to: chikara0323@gmail.com
          from: "輸出ラボBot <noreply@yushutsu-fukugyo.com>"
          body: |
            輸出ラボ自動投稿でエラーが発生しました。

            ▼ エラーログを確認
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ─────────────────────────────
            ワークフロー : ${{ github.workflow }}
            トリガー     : ${{ github.event_name }}
