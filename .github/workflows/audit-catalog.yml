name: Catalog precision audit

# 本番カタログの精度を独立審判(Sonnet)で実測監査。手動実行のみ。本番KVには触れない（結果はログのみ）。
on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run catalog audit
        env:
          EBAY_APP_ID:        ${{ secrets.EBAY_APP_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/audit_catalog.mjs
