name: Liveness Alert (売切見張りの死活監視)

# スマホ(住宅IP)の売切ワーカーが止まってないかを2時間ごとにチェックし、
# 3時間以上 心拍(liveness_status)が更新されてなければメールで通知する。
# 監視はクラウド側に置く＝スマホ本体が死んでも気づける。新規シークレットは不要(既存のKV/RESENDを流用)。
on:
  schedule:
    - cron: "0 */2 * * *"   # 2時間ごと
  workflow_dispatch:         # 手動実行（即時確認用）
    inputs:
      test:
        description: "テストメールを1通送る（配信確認用）"
        type: boolean
        default: false

jobs:
  liveness-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 死活チェック（止まっていればメール）
        env:
          KV_REST_API_URL:   ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          # 手動実行で test=true のときだけテストメールを送る
          LIVENESS_ALERT_TEST: ${{ github.event.inputs.test == 'true' && '1' || '0' }}
          # 必要なら調整: LIVENESS_STALE_HOURS(既定3) / LIVENESS_REMIND_HOURS(既定24)
        run: node scripts/livenessAlert.mjs

      - name: 失敗通知メール（監視ジョブ自体のエラー）
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.resend.com
          server_port: 465
          secure: true
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: "❌ 輸出ラボ 死活監視(liveness-alert)エラー"
          to: chikara0323@gmail.com
          from: "輸出ラボBot <noreply@yushutsu-fukugyo.com>"
          body: |
            死活監視ジョブ自体が失敗しました。
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
