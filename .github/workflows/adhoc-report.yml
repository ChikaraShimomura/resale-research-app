name: アドホック分析メール(手動のみ)

# 一回きりの分析メールを手動で送るための汎用ワークフロー(cronなし)。
# script入力に scripts/ 配下のスクリプト名を渡す。
on:
  workflow_dispatch:
    inputs:
      script:
        description: '実行するスクリプト(scripts/配下のファイル名)'
        required: true
        default: 'tbVsBrReport.mjs'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run report script
        env:
          SEDORI_SUPABASE_URL: ${{ secrets.SEDORI_SUPABASE_URL }}
          SEDORI_SUPABASE_ANON_KEY: ${{ secrets.SEDORI_SUPABASE_ANON_KEY }}
          SEDORI_REPORT_TOKEN: ${{ secrets.SEDORI_REPORT_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node "scripts/${{ github.event.inputs.script }}"
