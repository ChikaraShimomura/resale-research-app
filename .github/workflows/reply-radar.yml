name: 輸出ラボ Xリプ候補レーダー

# 「今リプすべきX投稿」を集めて運営者にメール通知する(送信は人手)。
# Xの読み取り(recent search)が必要 = Basic以上 or 従量の読み取り権限。
on:
  # 2026-06-22 定期実行は cron-job.org からの workflow_dispatch に移行（GitHub内蔵cronは遅延/スキップが多いため）。
  #   cron-job.org が毎日 20:00 JST(Asia/Tokyo) に /dispatches を叩く。二重起動防止でGitHubのscheduleは無効化。
  #   GitHub cronに戻したい時は下記2行のコメントを解除する（X読み取り＋Anthropic分類のコスト発生）。
  # schedule:
  #   - cron: '0 11 * * *'   # JST 20時。cron-job.org移行で停止
  workflow_dispatch:

jobs:
  radar:
    if: ${{ false }}  # ⏸ 2026-07-22 輸出ラボ全体を畳む(ユーザー指示)。cron-job.orgが叩いてもskip=課金ゼロ。再開はこの行を削除。
    # 2026-06-29 再開(ユーザー指示)。2026-06-25にコスト停止していたXリプ候補レーダーを再稼働。
    #   ⚠️ X読み取り(recent search・Basic以上が必要)＋Anthropic分類で課金が出る。cron-job.orgが毎日20:00 JSTに dispatch。
    #   再び止めたい時は次行に `if: ${{ false }}` を足すだけ（cron-job.orgが叩いてもskip＝課金ゼロ）。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install tweepy anthropic requests pytz

      - name: Run reply radar
        env:
          TWITTER_API_KEY:             ${{ secrets.YUSHUTSU_TWITTER_API_KEY }}
          TWITTER_API_SECRET:          ${{ secrets.YUSHUTSU_TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:        ${{ secrets.YUSHUTSU_TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.YUSHUTSU_TWITTER_ACCESS_TOKEN_SECRET }}
          TWITTER_BEARER_TOKEN:        ${{ secrets.YUSHUTSU_TWITTER_BEARER_TOKEN }}
          TWITTER_SELF_USERNAME:       ${{ secrets.YUSHUTSU_TWITTER_SELF_USERNAME }}
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          KV_REST_API_URL:             ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN:           ${{ secrets.KV_REST_API_TOKEN }}
          RESEND_API_KEY:              ${{ secrets.RESEND_API_KEY }}
        run: python scripts/sns_bot/reply_radar.py

      - name: エラー通知メール
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.resend.com
          server_port: 465
          secure: true
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: "❌ 輸出ラボ Xリプ候補レーダー エラー"
          to: chikara0323@gmail.com
          from: "輸出ラボBot <noreply@yushutsu-fukugyo.com>"
          body: |
            Xリプ候補レーダーでエラーが発生しました。
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
