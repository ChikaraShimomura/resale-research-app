name: 輸出ラボ Xリプ候補レーダー

# 「今リプすべきX投稿」を集めて運営者にメール通知する(送信は人手)。
# Xの読み取り(recent search)が必要 = Basic以上 or 従量の読み取り権限。
on:
  # 🛑 コスト停止中（2026-06-17・ユーザー指示）: Xリプ候補レーダーの自動実行(schedule)を一時停止。
  #    Anthropic(分類)＋X API読み取りコストが発生するため。再開は下記 cron のコメントを外すだけ。
  # schedule:
  #   - cron: '0 11 * * *'   # JST 20時(夜のゴールデン帯)に1日1回。倹約モード(読み取りコスト最小)
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install tweepy anthropic requests pytz

      - name: Run reply radar
        env:
          TWITTER_API_KEY:             ${{ secrets.YUSHUTSU_TWITTER_API_KEY }}
          TWITTER_API_SECRET:          ${{ secrets.YUSHUTSU_TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:        ${{ secrets.YUSHUTSU_TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.YUSHUTSU_TWITTER_ACCESS_TOKEN_SECRET }}
          TWITTER_BEARER_TOKEN:        ${{ secrets.YUSHUTSU_TWITTER_BEARER_TOKEN }}
          TWITTER_SELF_USERNAME:       ${{ secrets.YUSHUTSU_TWITTER_SELF_USERNAME }}
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          KV_REST_API_URL:             ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN:           ${{ secrets.KV_REST_API_TOKEN }}
          RESEND_API_KEY:              ${{ secrets.RESEND_API_KEY }}
        run: python scripts/sns_bot/reply_radar.py

      - name: エラー通知メール
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.resend.com
          server_port: 465
          secure: true
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: "❌ 輸出ラボ Xリプ候補レーダー エラー"
          to: chikara0323@gmail.com
          from: "輸出ラボBot <noreply@yushutsu-fukugyo.com>"
          body: |
            Xリプ候補レーダーでエラーが発生しました。
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
