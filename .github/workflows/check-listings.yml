name: Listing Source Check (出品中の楽天死活/在庫)

# 出品中(未売却・未停止)の listing について、仕入れ元の楽天商品が 売り切れ/掲載終了 になっていないかを
# ~30分ごとに確認し、deal に sourceStatus フラグを立てる（マイページの出品中一覧に⚠️表示）。
# 楽天API のみ＝無料。AI不使用。公開リポジトリのため GitHub Actions の実行時間も無料（無制限）。
# ※スケジュールはベストエフォート（GitHub混雑時は遅延/スキップあり）。失敗メールは付けない（30分毎=スパム化するため）。
on:
  # スケジューリングは外部cron（cron-job.org）から workflow_dispatch でトリガーする運用（tweet-yushutsu と同方式）。
  # GitHub Actions の schedule は時刻が不正確（30〜60分遅延・混雑時スキップ・60日無コミットで自動停止）のため使わない。
  # cron-job.org 側を「15分ごと」に設定＝確実・無料。手動実行は Actions UI（この workflow_dispatch）から。
  workflow_dispatch:
  # 🔴 2026-10-13 砦: cron-job.org の 15 分ごとのジョブが 2026-09-30 に無くなっていて、Pixel が 10/8〜10/10 と 10/10〜 の 2 回
  #   止まったのにメールが 1 通も出なかった (最後の dispatch は 2026-09-30T01:15Z)。cron-job.org のジョブを作り直すまでの間も
  #   見張りが完全に止まらないように、GitHub の schedule も置く (間引かれて数時間おきになる実測があるので主役にはしない。
  #   公開リポジトリは 60 日コミットが無いと schedule が止まる点にも注意)。二重に動いても KV が二重送信を防ぐ。
  schedule:
    - cron: "7,22,37,52 * * * *"

# 同時に複数走らないように（前回が長引いても二重実行しない）
concurrency:
  group: check-listings
  cancel-in-progress: false

jobs:
  # TCG買取表の Pixel ワーカーの見張り (2026-09-22 相乗り・オーナー指示「Pixel の動きが止まったらすぐにメール」)。
  # 上の check-listings は輸出ラボを畳んで止めてあるが、cron-job.org からの15分ごとの dispatch は続いているので、
  # それに乗せて見張る (GitHub の schedule は間引かれて3〜5時間おきにしか動かない実測がある・公開リポジトリなので無料)。
  # Pixel が10分ごとに Actions の変数 TORECA_PIXEL_HEARTBEAT に合図を書き、途切れたらメール・戻ったらメール (scripts/torecaPixelWatch.mjs)。
  # 2026-10-13 静かにする直し: 合図が 60 分途切れたら 1 通・止まったままなら 72 時間ごとに続報・戻ったら 1 通。
  #   メールを送れない・状態 (KV) が読めない/書けない時は例外で終わり、6 時間に 1 回だけ回が赤くなる (GitHub の失敗メールが最後の砦)。
  toreca-pixel-watch:
    # 2026-10-13: 実行機を固定する (ubuntu-latest は 2026-10-19 から Ubuntu 26 に切り替わる予告。見張りが切り替えで止まらないように。中身は今と同じ)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/torecaPixelWatch.mjs
          sparse-checkout-cone-mode: false
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pixel の合図を確かめる
        env:
          TORECA_PIXEL_HEARTBEAT: ${{ vars.TORECA_PIXEL_HEARTBEAT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          MAIL_TO: chikara0323@gmail.com
        run: node scripts/torecaPixelWatch.mjs

  # TCG買取表の販売の写し (2026-11-04 相乗り・オーナー承認「鍵を置いてよい」)。
  # 販売は貸しサーバーが毎時 38/51 分に取り、束 3 本を置き場 (Supabase の sales-bundles) に置く。それを枝 sales-feed へ写す
  # (toreca-kaitori-app の日次の起動の時だけだと 17:10〜翌 6:05 に販売が動かない・あちらは Actions の分数が有料)。
  # 新しい回が無ければ何も送らない。台本は toreca-kaitori-app の main の scripts/import-server-sales.mjs (落ちても exit 0)。
  # 鍵 = toreca-kaitori-app だけに書ける配置鍵 (secrets.TORECA_SALES_FEED_KEY)。ファイルにして ssh -i で渡し、終わったら消す
  toreca-sales-copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: TCG買取表の台本を取る
        uses: actions/checkout@v4
        with:
          repository: ChikaraShimomura/toreca-kaitori-app
          ref: main
          ssh-key: ${{ secrets.TORECA_SALES_FEED_KEY }}
          persist-credentials: false
          sparse-checkout: |
            scripts/import-server-sales.mjs
            scripts/lib/sales-bundle.mjs
            scripts/lib/server-jobs.mjs
            sales/cloud/worker-put/validate.mjs
            worker/server-jobs.txt
          sparse-checkout-cone-mode: false
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 販売の束を枝 sales-feed へ写す
        env:
          REPO: ChikaraShimomura/toreca-kaitori-app
          SALES_FEED_KEY: ${{ secrets.TORECA_SALES_FEED_KEY }}
          GH_META_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/sales-feed-ssh"
          mkdir -p "$d" && chmod 700 "$d"
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$SALES_FEED_KEY" > "$d/key" && chmod 600 "$d/key"
          # GitHub の SSH の鍵 (公開の一覧) だけを信じる
          curl -fsS -H "Authorization: Bearer $GH_META_TOKEN" https://api.github.com/meta \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const k of JSON.parse(s).ssh_keys)console.log("github.com "+k)})' > "$d/known_hosts"
          export SALES_FEED_SSH_COMMAND="ssh -i $d/key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o UserKnownHostsFile=$d/known_hosts -o StrictHostKeyChecking=yes"
          node scripts/import-server-sales.mjs

  check-listings:
    if: ${{ false }}  # ⏸ 2026-07-22 輸出ラボ全体を畳む(ユーザー指示)。cron-job.orgが叩いてもskip=課金ゼロ。再開はこの行を削除。
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run listing source check
        env:
          RAKUTEN_APP_ID:       ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY:   ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          KV_REST_API_URL:      ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN:    ${{ secrets.KV_REST_API_TOKEN }}
        run: node scripts/checkListings.mjs

      # 検知の直後に自動停止：売切/リンク切れの出品をeBayから取り下げる（離席中でも~30分以内）。
      # eBayトークンの復号(EBAY_TOKEN_ENC_KEY)が要るためアプリのルートで実行し、ここはCRON_SECRETで叩くだけ。
      # 失敗してもジョブは落とさない（次回再試行＋アプリを開いた時にも停止される）。
      - name: 仕入れ元が売切/リンク切れの出品を自動停止
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://www.yushutsu-fukugyo.com/api/ebay/list/auto-stop-cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "auto-stop-cron HTTP $code"
          if [ "$code" != "200" ]; then echo "::warning::auto-stop-cron が HTTP $code を返しました（CRON_SECRET不一致やミドルウェア403の可能性）"; fi
