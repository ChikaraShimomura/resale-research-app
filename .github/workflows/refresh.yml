name: Background Refresh (Rakuten + eBay + Claude Haiku)

# スケジューリングは外部cron（cron-job.org）から workflow_dispatch で叩く運用（check-listings / tweet-yushutsu と同方式）。
# GitHub Actions の schedule は時刻が不正確（遅延・混雑時スキップ・スケジュール変更直後の発火漏れ）で、
# 実際に2026-06-17以降6日間 止まっていた実績があるため使わない。cron-job.org 側を「毎日1回」に設定＝確実・無料。
# 推奨時刻 16:00 UTC（=翌01:00 JST・低トラフィック帯）。手動実行は Actions UI（この workflow_dispatch）から。
# コスト: 月予算 ¥30,000(2026-06-23 ユーザー引き上げ)。MAX_PROCESS=600/日(1回≈$5〜7)＝Pixel落札発掘の種(ebay_sold_seed)を
#   数日で消化→以後は新規の落札分だけでキャッシュ効き自然に安く戻る。RPMは43(Tier1安全側)据え置き=600なら180分内で余裕・429精度低下を回避。
#   ティアを実効化したら ANTHROPIC_RPM を実RPMの約8割で env 追加→更に高速化可。profitable_products TTL=20日なので日次ならTTL切れも防げる。
on:
  workflow_dispatch:

# 二重実行防止（手動 + cron-job.org が重なっても1本だけ走らせる）。
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180      # MAX_PROCESS=600（落札seedの楽天マッチ＝画像AI）ぶん余裕を持たせる

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run refresh script
        env:
          RAKUTEN_APP_ID:       ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY:   ${{ secrets.RAKUTEN_ACCESS_KEY }}
          EBAY_APP_ID:          ${{ secrets.EBAY_APP_ID }}
          EBAY_CLIENT_SECRET:   ${{ secrets.EBAY_CLIENT_SECRET }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          KV_REST_API_URL:      ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN:    ${{ secrets.KV_REST_API_TOKEN }}
          RAKUTEN_FIRST:        '0'   # ③楽天-first: 検証の結果eBay-firstと種が重複し純増0だったため一旦OFF(コードは残置・将来ニッチ種に差替で再有効化)
          IMG_MATCH_SONNET_BUDGET: '500'  # 落札seed×楽天の同一判定でSonnet確認が増える分の天井（予算¥3万・精度維持）
          MAX_PROCESS: '600'  # 月予算¥3万（1回≈$5〜7）。バックログ+腕時計拡張を~4〜5日で消化→以後は新規分だけで安く戻る
          PRICE_VERIFY_BUDGET: '100'  # 件数増に合わせ50→100。最安が疑わしい時だけ画像確定(キャッシュで以後無料)
        run: node scripts/refresh.mjs

      # 商品取得(refresh)の直後に透かし検知も実行(option A)。新商品の透かし入りを一覧から除外。
      # 判定はKVにキャッシュされ再課金されない＝追加コストは新商品ぶんのみ(数銭〜)。失敗してもrefreshは止めない。
      - name: Run watermark check (透かし入りを一覧から除外)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KV_REST_API_URL:   ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: node scripts/checkWatermarks.mjs

      - name: エラー通知メール
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.resend.com
          server_port: 465
          secure: true
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: "❌ 輸出ラボ 商品取得(refresh)エラー"
          to: chikara0323@gmail.com
          from: "輸出ラボBot <noreply@yushutsu-fukugyo.com>"
          body: |
            商品取得バッチ(refresh.mjs)でエラーが発生しました。

            ▼ エラーログを確認
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ─────────────────────────────
            ワークフロー : ${{ github.workflow }}
            トリガー     : ${{ github.event_name }}

