name: Background Refresh (Rakuten + eBay + Claude Haiku)

on:
  # 2026-06-22 日次に変更（ユーザー指示）。月額の上限を「¥10,000未満」に収めるため1回の処理量を絞る:
  #   費用は処理件数に比例（実測: 800件処理＝Haiku750+Sonnet253≈$5/回）。日次=月30回なので、
  #   1回 ≲$2 に抑えれば月 ≲$60(≒¥9,000) で確実に¥1万を切る。→ 下の env で
  #   MAX_PROCESS=200・PRICE_VERIFY_BUDGET=50・IMG_MATCH_SONNET_BUDGET=200 に下げ、1回≈$1.5〜2にキャップ。
  #   画像マッチは30日キャッシュ(img_match5:)＋checked_ids(恒久)で新規分のみ処理＝定常はさらに安い。
  #   未処理バックログ(約2,300件)は 200件/日 ≈ 12日で消化→以後は新規分だけ。
  #   profitable_productsのTTLは20日なので日次更新ならTTL切れ(ランキング空)も当然防げる。
  #   速く埋めたい時だけ workflow_dispatch で手動実行（必要なら一時的に MAX_PROCESS を上げる）。
  schedule:
    - cron: '0 16 * * *'   # 毎日 16:00 UTC = 翌01:00 JST（低トラフィック帯）。コストを抑えたい時は週1 '0 6 * * 0' に戻す
  workflow_dispatch:          # 手動実行ボタン（今すぐ更新・スポット増量したい時）

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120      # 最大120分（102キーワード×5ページ対応）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run refresh script
        env:
          RAKUTEN_APP_ID:       ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY:   ${{ secrets.RAKUTEN_ACCESS_KEY }}
          EBAY_APP_ID:          ${{ secrets.EBAY_APP_ID }}
          EBAY_CLIENT_SECRET:   ${{ secrets.EBAY_CLIENT_SECRET }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          KV_REST_API_URL:      ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN:    ${{ secrets.KV_REST_API_TOKEN }}
          RAKUTEN_FIRST:        '0'   # ③楽天-first: 検証の結果eBay-firstと種が重複し純増0だったため一旦OFF(コードは残置・将来ニッチ種に差替で再有効化)
          IMG_MATCH_SONNET_BUDGET: '200'  # 日次コスト上限用。MAX_PROCESS=200ならSonnet確認は通常~60件で頭打ち＝この200は事実上バインドせず精度は維持（保険の天井）
          MAX_PROCESS: '200'  # 日次の費用キャップ（1回≈$1.5〜2／月≲¥9,000）。バックログは~12日で消化。速く埋めたい時だけ手動実行で一時的に上げる
          PRICE_VERIFY_BUDGET: '50'  # 日次コスト上限用に150→50。最安が疑わしい時だけ画像確定(キャッシュで以後無料)
        run: node scripts/refresh.mjs

      # 商品取得(refresh)の直後に透かし検知も実行(option A)。新商品の透かし入りを一覧から除外。
      # 判定はKVにキャッシュされ再課金されない＝追加コストは新商品ぶんのみ(数銭〜)。失敗してもrefreshは止めない。
      - name: Run watermark check (透かし入りを一覧から除外)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KV_REST_API_URL:   ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: node scripts/checkWatermarks.mjs

      - name: エラー通知メール
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.resend.com
          server_port: 465
          secure: true
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: "❌ 輸出ラボ 商品取得(refresh)エラー"
          to: chikara0323@gmail.com
          from: "輸出ラボBot <noreply@yushutsu-fukugyo.com>"
          body: |
            商品取得バッチ(refresh.mjs)でエラーが発生しました。

            ▼ エラーログを確認
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ─────────────────────────────
            ワークフロー : ${{ github.workflow }}
            トリガー     : ${{ github.event_name }}

